name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (node ${{ matrix.node }}, nest ${{ matrix.nest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        nest: [11, 12]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:e2e
        env:
          NEST_VERSION: ${{ matrix.nest }}

  db:
    name: db (nest ${{ matrix.nest }}, typeorm ${{ matrix.typeorm }}, mikro ${{ matrix.mikro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nest: 12, typeorm: '^1', mikro: '^7' }
          - { nest: 11, typeorm: '^0.3', mikro: '^6' }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:db
        env:
          REQUIRE_DOCKER: '1'
          NEST_VERSION: ${{ matrix.nest }}
          TYPEORM_VERSION: ${{ matrix.typeorm }}
          MIKRO_VERSION: ${{ matrix.mikro }}

  bench:
    name: overhead benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run benchmark
        env:
          NEST_VERSION: 12
        run: pnpm --silent bench | tail -n 1 | tee bench.json
      - name: Post to job summary
        if: always()
        run: |
          {
            echo '### HTTP overhead (p99 latency, ms)'
            echo '```json'
            cat bench.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
